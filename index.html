<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chubby Red Panda Pure Head HUD</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="music-open">
  <main id="cockpit" class="theme-classic engine-off belt-unfastened" aria-label="Red Panda Vehicle HUD">
    
    <!-- MENU PENGATURAN & YOUTUBE MUSIC PLAYER MELAYANG DI ATAS KEPALA -->
    <div id="settingsMenu">
      <div class="settings-heading">
        <span class="settings-dot"></span>
        <span>RED PANDA HUD CONFIG</span>
        <button id="closeSettings" class="icon-button" type="button" aria-label="Tutup pengaturan">×</button>
      </div>

      <div class="menu-btns">
        <button type="button" data-act="resize">Resize</button>
        <button type="button" data-act="move">Pindah</button>
        <button type="button" data-act="reset">Reset</button>
        <button type="button" data-act="theme">Fur Theme</button>
      </div>

      <!-- PEMUTAR MUSIK YOUTUBE -->
      <section id="music-panel" class="music-panel no-drag" aria-label="Online Music Player">
        <div class="music-now-playing">
          <div class="music-video-wrap">
            <div id="youtube-player"></div>
            <img id="music-cover" class="music-cover" alt="" aria-hidden="true">
            <div id="music-player-placeholder" class="music-placeholder">
              <span class="music-placeholder-note" aria-label="Music">♪</span>
            </div>
          </div>
          <div class="music-track-meta">
            <div id="music-track-title">Belum ada lagu</div>
            <div id="music-track-subtitle">Online playback</div>
          </div>
        </div>

        <div class="music-progress-row">
          <span id="music-current-time">0:00</span>
          <input id="music-progress" class="music-range" type="range" min="0" max="1000" value="0" step="1" aria-label="Song progress">
          <span id="music-duration">0:00</span>
        </div>

        <div class="music-main-controls">
          <button id="btn-music-prev" class="music-control-btn" type="button" title="Previous">⏮</button>
          <button id="btn-music-play" class="music-play-btn" type="button" title="Play / Pause">▶</button>
          <button id="btn-music-next" class="music-control-btn" type="button" title="Next">⏭</button>
        </div>

        <div class="music-volume-row">
          <button id="btn-music-mute" class="music-icon-btn" type="button" title="Mute">🔊</button>
          <input id="music-volume" class="music-range" type="range" min="0" max="100" value="80" step="1" aria-label="Volume">
          <button id="btn-music-add-toggle" class="music-small-btn music-add-toggle" type="button" title="Tambah lagu">＋</button>
        </div>

        <div id="music-add-row" class="music-add-row hide">
          <input id="music-url-input" type="text" placeholder="Link YouTube / ID Video" autocomplete="off">
          <input id="music-title-input" type="text" placeholder="Nama lagu (opsional)" autocomplete="off">
          <button id="btn-music-add" class="music-small-btn music-add-primary" type="button">▶</button>
        </div>

        <div class="music-tools-row">
          <button id="btn-music-repeat" class="music-tool-btn" type="button" title="Ulangi lagu">↻</button>
          <button id="btn-music-shuffle" class="music-tool-btn" type="button" title="Putar acak">⤨</button>
        </div>

        <div class="music-playlist-head">
          <span>Playlist</span>
          <button id="btn-music-clear" class="music-text-btn" type="button" title="Kosongkan playlist">×</button>
        </div>
        <div id="music-playlist" class="music-playlist" role="list">
          <div class="music-empty">Playlist kosong. Tekan + untuk menambah lagu.</div>
        </div>
      </section>

      <div id="settingsHint">Klik kanan pada kepala panda untuk menutup menu</div>
      <div class="settings-footer">
        <span>RED PANDA OS</span>
        <span>REACTIVE SPEEDO</span>
      </div>
    </div>

    <!-- SILUET KEPALA MURNI PANDA MERAH (INSTRUMEN UTAMA) -->
    <svg id="pandaHeadSvg" class="panda-head-svg" viewBox="0 0 480 460" role="img" aria-label="Chubby Red Panda Speedometer">
      <defs>
        <!-- Gradien Bulu Kepala -->
        <linearGradient id="coatGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--coat-light)"/>
          <stop offset="50%" stop-color="var(--coat-base)"/>
          <stop offset="100%" stop-color="var(--coat-dark)"/>
        </linearGradient>

        <!-- Gradien Telinga -->
        <linearGradient id="earGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--ear-back)"/>
          <stop offset="100%" stop-color="var(--coat-dark)"/>
        </linearGradient>

        <!-- Gradien Pupil RPM Gauge -->
        <linearGradient id="rpmArcGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="var(--gauge-start)"/>
          <stop offset="70%" stop-color="var(--gauge-mid)"/>
          <stop offset="100%" stop-color="#ff1a40"/>
        </linearGradient>

        <!-- Filter Glow Neon / Redline Fire -->
        <filter id="flameGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <!-- Sorot Headlight Beam -->
        <linearGradient id="headlightBeamGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(255, 255, 200, 0.8)"/>
          <stop offset="100%" stop-color="rgba(255, 255, 200, 0)"/>
        </linearGradient>
      </defs>

      <!-- 1. DAUN TELINGA (SEIN & AERODINAMIS) -->
      <g id="earLeft" class="ear-group ear-l">
        <path class="ear-outer" d="M 135 145 C 95 90 108 32 156 42 C 182 48 186 102 166 148 Z"/>
        <path class="ear-inner" d="M 140 138 C 112 95 124 52 152 60 C 168 64 172 105 158 138 Z"/>
        <path class="ear-fluff" d="M 125 125 C 135 110 148 120 146 135 C 152 118 165 118 160 136 Z"/>
        <circle id="earIndicatorLeft" class="ear-indicator-light" cx="152" cy="58" r="8"/>
      </g>

      <g id="earRight" class="ear-group ear-r">
        <path class="ear-outer" d="M 345 145 C 385 90 372 32 324 42 C 298 48 294 102 314 148 Z"/>
        <path class="ear-inner" d="M 340 138 C 368 95 356 52 328 60 C 312 64 308 105 322 138 Z"/>
        <path class="ear-fluff" d="M 355 125 C 345 110 332 120 334 135 C 328 118 315 118 320 136 Z"/>
        <circle id="earIndicatorRight" class="ear-indicator-light" cx="328" cy="58" r="8"/>
      </g>

      <!-- 2. SILUET KEPALA GEMBUL & BULU PIPI MEKAR -->
      <g id="headSilhouette" class="head-silhouette-group">
        <path class="head-base-coat" d="M 155 120 C 195 98, 285 98, 325 120 C 365 132, 405 165, 412 205 C 428 208, 442 220, 448 238 C 454 256, 446 276, 432 290 C 442 305, 438 325, 420 338 C 400 352, 375 358, 350 365 C 315 385, 275 392, 240 392 C 205 392, 165 385, 130 365 C 105 358, 80 352, 60 338 C 42 325, 38 305, 48 290 C 34 276, 26 256, 32 238 C 38 220, 52 208, 68 205 C 75 165, 115 132, 155 120 Z"/>

        <!-- Alis Putih Khas Panda Merah -->
        <ellipse class="brow-patch brow-l" cx="160" cy="162" rx="20" ry="12"/>
        <ellipse class="brow-patch brow-r" cx="320" cy="162" rx="20" ry="12"/>

        <!-- Bulu Pipi Tebal Putih Kiri & Kanan -->
        <path class="cheek-fluff-white cheek-fluff-l" d="M 68 215 C 50 245, 52 280, 80 305 C 110 326, 145 315, 158 285 C 166 260, 142 230, 112 216 Z"/>
        <path class="cheek-fluff-white cheek-fluff-r" d="M 412 215 C 430 245, 428 280, 400 305 C 370 326, 335 315, 322 285 C 314 260, 338 230, 368 216 Z"/>

        <!-- Corak Rona Pipi (Fuel / Bensin) -->
        <ellipse id="blushLeft" class="cheek-blush" cx="112" cy="265" rx="28" ry="18"/>
        <ellipse id="blushRight" class="cheek-blush" cx="368" cy="265" rx="28" ry="18"/>

        <!-- Tetes Keringat Dingin Kartun (Saat Bensin Kritis) -->
        <path id="sweatDropLeft" class="sweat-drop" d="M 88 245 C 84 254 82 260 88 266 C 94 266 98 258 92 250 Z"/>
        <path id="sweatDropRight" class="sweat-drop" d="M 392 245 C 388 254 386 260 392 266 C 398 266 402 258 396 250 Z"/>

        <!-- Plester Silang Kartun di Pipi (Saat Health Rendah) -->
        <g id="cheekBandage" class="cheek-bandage">
          <rect x="100" y="276" width="22" height="7" rx="3.5" transform="rotate(35 111 279)"/>
          <rect x="100" y="276" width="22" height="7" rx="3.5" transform="rotate(-35 111 279)"/>
        </g>

        <!-- Moncong Putih -->
        <path class="snout-white" d="M 194 256 C 200 236, 280 236, 286 256 C 298 286, 286 345, 240 350 C 194 345, 182 286, 194 256 Z"/>
      </g>

      <!-- 3. MATA KIRI: SPEEDOMETER DIGITAL -->
      <g id="eyeLeftContainer" class="eye-group eye-l">
        <circle class="eye-socket" cx="160" cy="220" r="46"/>
        <circle class="eye-screen" cx="160" cy="220" r="42"/>
        <circle class="eye-glass-glare" cx="145" cy="205" r="30"/>

        <!-- Angka Speedometer Digital -->
        <g id="speedDisplayGroup" class="speed-text-group">
          <text id="speedValue" class="speed-num" x="160" y="227" text-anchor="middle">000</text>
          <text id="speedUnit" class="speed-unit" x="160" y="247" text-anchor="middle">KM/H</text>
        </g>

        <!-- Kelopak Mata Terpejam (Engine Off) -->
        <path id="eyeLeftSleep" class="eye-closed-lid" d="M 124 220 Q 160 250 196 220"/>

        <!-- Mata Berputar Pusing / Spiral (Health Kritis < 20%) -->
        <path id="eyeLeftSpiral" class="eye-spiral" d="M 160 220 m 0,0 a 4,4 0 0,1 4,4 a 8,8 0 0,1 -8,4 a 12,12 0 0,1 -8,-12 a 18,18 0 0,1 18,-12 a 24,24 0 0,1 24,24 a 30,30 0 0,1 -30,30"/>

        <!-- Bulir Air Mata Memercik (Overspeed >= 60) -->
        <g id="eyeLeftTears" class="overspeed-tears">
          <path class="tear-droplet tear-1" d="M 122 208 C 108 200 96 206 92 214 C 88 222 104 222 118 217 Z"/>
          <path class="tear-droplet tear-2" d="M 118 226 C 104 224 94 234 90 242 C 86 250 102 246 114 234 Z"/>
        </g>
      </g>

      <!-- 4. MATA KANAN: TACHOMETER RPM -->
      <g id="eyeRightContainer" class="eye-group eye-r">
        <circle class="eye-socket" cx="320" cy="220" r="46"/>
        <circle class="eye-screen" cx="320" cy="220" r="42"/>
        <circle class="eye-glass-glare" cx="305" cy="205" r="30"/>

        <!-- RPM Tachometer Arc Circular -->
        <circle class="rpm-track-bg" cx="320" cy="220" r="32"/>
        <circle id="rpmArc" class="rpm-progress-arc" cx="320" cy="220" r="32" stroke-dasharray="201.06" stroke-dashoffset="201.06" transform="rotate(-90 320 220)"/>

        <!-- Pupil Kanan & Nilai RPM -->
        <g id="rpmPupilCenter" class="rpm-pupil-group">
          <circle id="rpmPupilDisc" class="rpm-pupil-disc" cx="320" cy="220" r="16"/>
          <text id="rpmValue" class="rpm-val-text" x="320" y="224" text-anchor="middle">0.0</text>
        </g>

        <!-- Aura Api Kartun Redline (> 85% RPM) -->
        <g id="fierceFlame" class="fierce-flame-group" filter="url(#flameGlow)">
          <path class="flame-tongue f1" d="M 362 210 C 378 190 395 186 405 168 C 398 186 385 196 380 216 Z"/>
          <path class="flame-tongue f2" d="M 356 195 C 370 176 385 166 392 148 C 384 168 372 178 368 202 Z"/>
          <path class="flame-tongue f3" d="M 362 225 C 382 220 398 226 408 214 C 395 228 380 230 366 232 Z"/>
        </g>

        <!-- Kelopak Mata Terpejam Kanan (Engine Off) -->
        <path id="eyeRightSleep" class="eye-closed-lid" d="M 284 220 Q 320 250 356 220"/>

        <!-- Mata Berputar Pusing / Spiral Kanan -->
        <path id="eyeRightSpiral" class="eye-spiral" d="M 320 220 m 0,0 a 4,4 0 0,1 4,4 a 8,8 0 0,1 -8,4 a 12,12 0 0,1 -8,-12 a 18,18 0 0,1 18,-12 a 24,24 0 0,1 24,24 a 30,30 0 0,1 -30,30"/>

        <!-- Bulir Air Mata Kanan (Overspeed >= 60) -->
        <g id="eyeRightTears" class="overspeed-tears">
          <path class="tear-droplet tear-1" d="M 358 208 C 372 200 384 206 388 214 C 392 222 376 222 362 217 Z"/>
          <path class="tear-droplet tear-2" d="M 362 226 C 376 224 386 234 390 242 C 394 250 378 246 366 234 Z"/>
        </g>
      </g>

      <!-- 5. HIDUNG & SOROT LAMPU KENDARAAN (HEADLIGHTS) -->
      <g id="noseArea" class="nose-group">
        <!-- Sorot Lampu Jauh (High Beam) -->
        <polygon id="highBeamCone" class="headlight-beam-cone" points="240,272 160,350 320,350" fill="url(#headlightBeamGrad)"/>
        
        <!-- Hidung Hitam Imut -->
        <path id="pandaNose" class="panda-nose-core" d="M 232 265 C 236 260, 244 260, 248 265 C 252 271, 244 278, 240 278 C 236 278, 228 271, 232 265 Z"/>
        <ellipse class="nose-shine" cx="237" cy="265" rx="3" ry="1.5"/>

        <!-- Gelembung Tidur / Snot Bubble (Engine Off) -->
        <g id="sleepBubbleGroup" class="sleep-bubble-group">
          <circle id="sleepBubble" class="sleep-bubble-circle" cx="254" cy="264" r="14"/>
          <path class="sleep-bubble-shine" d="M 251 258 Q 256 256 260 259" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
        </g>
      </g>

      <!-- 6. MULUT, GIGI, & RANTING BAMBU (SPEED & HEALTH) -->
      <g id="mouthArea" class="mouth-group">
        <!-- Ranting Bambu Hijau Segar Digigit Panda -->
        <g id="bambooFresh" class="bamboo-branch bamboo-fresh">
          <path class="bamboo-stalk" d="M 180 315 L 295 296" stroke="#46c354" stroke-width="6" stroke-linecap="round"/>
          <line class="bamboo-node" x1="210" y1="310" x2="212" y2="315" stroke="#25752e" stroke-width="3"/>
          <line class="bamboo-node" x1="265" y1="301" x2="267" y2="306" stroke="#25752e" stroke-width="3"/>
          <!-- Daun Bambu Segar -->
          <path class="bamboo-leaf leaf-1" d="M 180 315 C 160 300 155 320 170 330 C 178 325 180 315 180 315 Z"/>
          <path class="bamboo-leaf leaf-2" d="M 192 312 C 180 295 198 288 206 304 Z"/>
          <path class="bamboo-leaf leaf-3" d="M 285 298 C 302 285 315 292 300 306 Z"/>
        </g>

        <!-- Ranting Bambu Patah (Health 40% - 79%) -->
        <g id="bambooBroken" class="bamboo-branch bamboo-broken">
          <path class="bamboo-stalk" d="M 222 308 L 285 298" stroke="#7aa34b" stroke-width="5.5" stroke-linecap="round"/>
          <path class="bamboo-leaf leaf-withered" d="M 285 298 C 298 290 304 298 294 305 Z"/>
        </g>

        <!-- Rongga Mulut: 3 Kondisi Kecepatan -->
        <!-- Kondisi 1: Mobil Diam (0 km/h) - Tersenyum Mengunyah -->
        <path id="mouthIdle" class="mouth-shape mouth-idle-smile" d="M 224 298 Q 233 306 240 302 Q 247 306 256 298" fill="none"/>

        <!-- Kondisi 2: Kecepatan Sedang (1-60 km/h) - Terbuka Ceria & Lidah Melambai -->
        <g id="mouthOpen" class="mouth-shape mouth-open-group">
          <path class="mouth-cavity" d="M 220 298 Q 240 295 260 298 Q 265 325 240 327 Q 215 325 220 298 Z"/>
          <path id="mouthTongue" class="mouth-tongue" d="M 228 316 Q 240 308 252 316 Q 248 326 240 326 Q 232 326 228 316 Z"/>
        </g>

        <!-- Kondisi 3: Sangat Cepat (> 100 km/h) - Mengatup Rapat Tegang -->
        <path id="mouthClenched" class="mouth-shape mouth-clenched-line" d="M 216 302 L 264 302" fill="none"/>

        <!-- Deretan Gigi Taring Kartun -->
        <!-- Gigi Sehat Utuh & Berkilau (Health 80% - 100%) -->
        <g id="teethHealthy" class="teeth-set teeth-healthy">
          <polygon class="fang fang-l" points="225,298 229,310 233,298"/>
          <polygon class="fang fang-r" points="247,298 251,310 255,298"/>
          <!-- Bintang Berkilau -->
          <path id="sparkleStar" class="fang-sparkle" d="M 230 305 L 232 300 L 234 305 L 239 307 L 234 309 L 232 314 L 230 309 L 225 307 Z"/>
        </g>

        <!-- Gigi Patah 1 Taring (Health 40% - 79%) -->
        <g id="teethDamaged" class="teeth-set teeth-damaged">
          <polygon class="fang fang-l" points="225,298 229,310 233,298"/>
          <polygon class="fang fang-r fang-broken-chip" points="247,298 250,303 252,301 254,298"/>
        </g>

        <!-- Gigi Ompong & Berantakan (Health < 20%) -->
        <g id="teethCritical" class="teeth-set teeth-critical">
          <polygon class="fang fang-chip" points="226,298 228,303 230,298"/>
          <polygon class="fang fang-chip" points="250,298 252,302 254,298"/>
        </g>
      </g>

      <!-- 7. LIONTIN LEHER / DAGU (TRANSMISI GIGI & ODOMETER) -->
      <g id="chinPendant" class="pendant-group">
        <!-- Tali Kerah Leher -->
        <path class="collar-band" d="M 205 378 Q 240 392 275 378" fill="none"/>
        <circle id="collarSeatbeltDot" class="collar-seatbelt-indicator" cx="240" cy="385" r="5"/>

        <!-- Liontin Medallion Bulat -->
        <circle class="pendant-outer-rim" cx="240" cy="414" r="28"/>
        <circle class="pendant-inner-disc" cx="240" cy="414" r="24"/>

        <!-- Tampilan Transmisi Gigi (P / R / N / D / 1-6) -->
        <text id="gearValue" class="pendant-gear-text" x="240" y="415" text-anchor="middle">N</text>

        <!-- Tampilan Odometer -->
        <text id="odometerValue" class="pendant-odo-text" x="240" y="430" text-anchor="middle">000000.0</text>
      </g>
    </svg>

    <!-- BANNER PERINGATAN OVERSPEED -->
    <div id="alarmBanner" role="status" aria-live="polite">
      <span class="alarm-symbol">!</span>
      <span>OVERSPEED DETECTED</span>
      <span class="alarm-speed">LIMIT 60</span>
    </div>
  </main>

  <audio id="speedAlarmAudio" src="speedlimit.mp3" preload="auto" loop></audio>
  <script src="script.js"></script>
</body>
</html>
